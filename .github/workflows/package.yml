name: Windows 构建与发布
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在的版本标签，例如 v0.1.0 或 v0.2.0-rc.1
        required: true
        type: string
      publish:
        description: 构建通过后发布 GitHub Release
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 检查 Tauri 跨端依赖版本
        run: python scripts/build/check_tauri_versions.py
      - name: 核对标签与提交
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          EXPECTED_COMMIT: ${{ github.event_name == 'push' && github.sha || '' }}
        run: python scripts/build/release.py metadata --tag "$RELEASE_TAG" --expected-commit "$EXPECTED_COMMIT" --github-output "$GITHUB_OUTPUT"

  checks:
    needs: metadata
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.metadata.outputs.commit }}

  windows:
    needs: [metadata, checks]
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: windows-release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: pnpm install --frozen-lockfile
      - name: 使用标签版本构建
        run: python scripts/build/release.py sync-version --tag "$RELEASE_TAG"
      - run: python scripts/build/build_host_resources.py
      - run: python scripts/build/build_windows_resources.py
      - run: python scripts/build/build_windows_resources.py --check
      - run: pnpm tauri build --ci --target x86_64-pc-windows-msvc --bundles nsis -- --locked
      - name: 整理安装包、便携包与 SHA256
        run: python scripts/build/release.py collect-windows --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: agentdesk-${{ needs.metadata.outputs.tag }}-windows-x64
          path: |
            .tmp/release/*.exe
            .tmp/release/*.zip
            .tmp/release/SHA256SUMS.txt
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    needs: [metadata, windows]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
      PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.metadata.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 确认标签仍指向构建提交
        run: python scripts/build/release.py metadata --tag "$RELEASE_TAG" --expected-commit "$RELEASE_COMMIT"
      - uses: actions/download-artifact@v4
        with:
          name: agentdesk-${{ needs.metadata.outputs.tag }}-windows-x64
          path: .tmp/release
      - name: 核验发布资产
        working-directory: .tmp/release
        run: sha256sum --check SHA256SUMS.txt
      - name: 上传完整资产后发布
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > "$RUNNER_TEMP/release-draft"; then
            if [[ "$(cat "$RUNNER_TEMP/release-draft")" != true ]]; then
              echo 'Release 已发布，请使用新标签；不会覆盖公开资产。' >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "AgentDesk $RELEASE_TAG" --prerelease="$PRERELEASE" \
              --notes-file .github/release-notes.md --generate-notes
          fi
          gh release upload "$RELEASE_TAG" \
            ".tmp/release/AgentDesk-${RELEASE_VERSION}-windows-x64-setup.exe" \
            ".tmp/release/AgentDesk-${RELEASE_VERSION}-windows-x64-portable.zip" \
            .tmp/release/SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE" --verify-tag
