[package]
name = "agentdesk"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"

[lib]
name = "agentdesk_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
russh = { version = "=0.65.0", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "=3.0.1"
rusqlite = { version = "0.38", features = ["bundled"] }
keyring = { version = "3.6", features = ["windows-native", "apple-native", "sync-secret-service"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"
directories = "6"
tempfile = "3"
base64 = "0.22"
portable-pty = "=0.9.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Authentication_Identity", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
async-trait = "0.1"
rand = "0.10"

[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = 0
