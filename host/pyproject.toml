[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "agentdesk-host"
version = "0.2.0"
description = "AgentDesk 远端 Agent Host"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = []

[project.optional-dependencies]
claude = ["claude-agent-sdk==0.2.174"]

[project.scripts]
agentdesk-host = "agentdesk_host.__main__:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "jsonschema>=4.23,<5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
